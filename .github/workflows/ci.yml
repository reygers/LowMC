name: Core CI

on:
  push:
  pull_request:

jobs:
  core-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix "$PWD/build/install"

      - name: Configure installed-package consumer
        run: >-
          cmake -S tests/install_consumer
          -B build/install-consumer
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$PWD/build/install"

      - name: Build installed-package consumer
        run: cmake --build build/install-consumer --parallel 2

      - name: Test installed-package consumer
        run: ctest --test-dir build/install-consumer --output-on-failure
